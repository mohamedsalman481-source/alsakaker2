  <style>:root{--navy:#153c51;--cream:#fff9ed;--rose:#eb638b;--mint:#34b3a3;--gold:#ffc85c;--ink:#244555;--edge:rgba(255,255,255,.7)}

<body>
  <noscript>اللعبة تحتاج إلى تفعيل JavaScript في المتصفح.</noscript>
  <main id="gameShell" aria-label="السكاكر — ليلى وليالي">
    <canvas id="world" aria-label="مساحة اللعب: المس للقفز، ثم المس مرة ثانية للقفزة الثانية"></canvas>
    <div id="loading" role="status"><span class="loadingCandy">🍬</span><h1>السكاكر</h1><p>بنجهّز المغامرة…</p></div>
    <header id="hud" hidden>
      <button class="heroBadge" id="switchHero" aria-label="تبديل البطلة"><canvas id="heroAvatar" width="100" height="110"></canvas><span><b id="heroName">ليلى</b><small>تبديل ⇄</small></span></button>
      <div class="vitals"><div id="hearts" aria-label="الصحة"></div><div class="score"><span id="score">0</span> نقطة <i>·</i> 🍬 <span id="candies">0</span></div></div>
      <div class="stageInfo"><small id="levelLabel"></small><b id="levelName"></b><div class="progressTrack"><i id="progress"></i></div></div>
      <button class="utility" id="pauseButton" aria-label="إيقاف مؤقت">Ⅱ</button>
    </header>
    <section id="bossHud" hidden><div><b id="bossName"></b><span id="bossStatus"></span></div><div class="bossTrack"><i id="bossHealth"></i></div></section>
    <div id="touchHint" hidden>المسي مساحة اللعب: نقرة = نطّة · نقرتان = نطّتان</div>
    <nav id="controls" aria-label="التحكم باللمس" hidden>
      <div class="movement">
        <button class="touchButton direction" data-hold="left" aria-label="تحرك لليسار">◀</button>
        <button class="touchButton direction" data-hold="right" aria-label="تحرك لليمين">▶</button>
      </div>
      <div class="pocket">
        <button class="itemButton" data-item="heart" aria-label="استخدام قلب العلاج">♥<small id="heartCount">1</small></button>
        <button class="itemButton" data-item="shield" aria-label="استخدام الدرع">◈<small id="shieldCount">0</small></button>
        <button class="itemButton" data-item="mint" aria-label="استخدام حذاء النعناع">ϟ<small id="mintCount">0</small></button>
        <button class="itemButton family" id="familyButton" aria-label="مساعدة العائلة">✦</button>
      </div>
      <div class="actions">
        <button class="touchButton attack" data-hold="attack" aria-label="هجوم">✧<small>هجوم</small></button>
        <button class="touchButton jump" id="jumpButton" aria-label="قفزة، ثم قفزة ثانية">↑<small>نطّة ×2</small></button>
      </div>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal" hidden><section id="panel" role="dialog" aria-modal="true" aria-label="قائمة اللعبة"></section></div>
    <footer id="desktopHelp" hidden>← → حركة &nbsp; Space نطّة ×2 &nbsp; J هجوم &nbsp; Q تبديل &nbsp; Esc توقف</footer>

  function update(){clock++;

    if([3,6,9,15].includes(L)){ctx.fillStyle=L===15?'#e4b96d':'#efd28b';ctx.beginPath();ctx.moveTo(-43,-53);ctx.lineTo(-47,-108);ctx.lineTo(-17,-83);ctx.lineTo(0,-121);ctx.lineTo(22,-84);ctx.lineTo(44,-110);ctx.lineTo(40,-53);ctx.closePath();ctx.fill();rect(-44,-66,89,13,5,'#ba8a68');}
    const grad=ctx.createRadialGradient(-25,-36,2,0,7,95);grad.addColorStop(0,boss.flash?'#fff':'#f8d9db');grad.addColorStop(.5,boss.flash?'#fff':base);grad.addColorStop(1,L===15?'#362d45':'#805e8e');ellipse(0,7,76,70,grad);ellipse(-32,72,25,10,base);ellipse(32,72,25,10,base);
    if([6,7].includes(L)){for(let i=0;i<9;i++)ellipse(Math.cos(i)*64,Math.sin(i)*52,19,18,L===7?'#e9e5f3':'#f7e1a9');}
    if(L===12){ctx.strokeStyle='#fbe4a9';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,7,63,0,7);ctx.stroke();for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ellipse(Math.cos(a)*58,7+Math.sin(a)*58,2,2,'#ffedb7');}}
    ellipse(-24,-6,17,21,'#fff9e9');ellipse(24,-6,17,21,'#fff9e9');ellipse(-27,-3,6,10,'#304959');ellipse(21,-3,6,10,'#304959');ellipse(-30,-8,2.5,3,'#fff');ellipse(18,-8,2.5,3,'#fff');ellipse(-45,22,12,5,'#e694a879');ellipse(45,22,12,5,'#e694a879');ctx.strokeStyle='#654466';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,29,20,.1,Math.PI-.1);ctx.stroke();for(let i=0;i<3;i++)star(-40+i*39,-44+Math.abs(i-1)*5,6,5,'#ffe8b2',i);
    if(boss.weak){ctx.strokeStyle='#ffe294';ctx.lineWidth=5;ctx.setLineDash([10,9]);ctx.beginPath();ctx.arc(0,7,94,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);for(let i=0;i<5;i++)star(Math.cos(t+i*1.25)*97,7+Math.sin(t+i*1.25)*97,6,5,'#fff3be',t);}else if(boss.active&&(boss.timer%Math.max(180,285-L*6))<35){ctx.strokeStyle='#df718b88';ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(player.x+22-boss.x-74,player.y+43-boss.y-80);ctx.stroke();ctx.setLineDash([]);}
    ctx.restore();ctx.globalAlpha=1;}
  function drawGate(){const x=4325;if(!visible(x,150))return;rect(x-12,GROUND-168,20,168,8,'#c79cab');rect(x+112,GROUND-168,20,168,8,'#c79cab');ctx.strokeStyle='#f9e3cf';ctx.lineWidth=21;ctx.beginPath();ctx.arc(x+60,GROUND-168,63,Math.PI,Math.PI*2);ctx.stroke();star(x+60,GROUND-239,17,5,'#ffdb8b');ctx.fillStyle='#fff5df';ctx.textAlign='center';ctx.font='bold 13px Tahoma';ctx.fillText('بوابة الحارس',x+60,GROUND-193);}
  function render(){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);drawSky();ctx.save();ctx.translate(-cam+(reduceMotion?0:(Math.random()-.5)*shake),worldY);for(const p of world.floors)drawPlatform(p);for(const p of world.platforms)drawPlatform(p);for(const c of world.candies)if(!c.taken&&visible(c.x,30))candy(c.x,c.y+Math.sin(clock*.04+c.id)*5,c.id);for(const e of world.enemies)if(e.alive)drawEnemy(e);drawGate();if(visible(2230))drawNpcSign('مريم',2230);if(boss?.active){if(visible(4410))drawNpcSign('بابا',4410);if(visible(4500))drawNpcSign('ماما',4500);}drawBoss();if(!['menu','route'].includes(state.mode))drawPlayer();for(const s of world.shots){if(!visible(s.x,20))continue;star(s.x,s.y,s.friendly?14:13,s.friendly?5:7,s.friendly?'#ffdf8b':'#ae729e',clock*.13);ellipse(s.x-2,s.y-3,3,3,'#fff6');}for(const s of world.sparks){ctx.globalAlpha=clamp(s.life/35,0,1);star(s.x,s.y,s.r,4,s.color,clock*.05);}ctx.globalAlpha=1;for(const r of world.rings){ctx.globalAlpha=r.life/22;ctx.strokeStyle=r.double?'#ffdc80':'#e8fff3';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(r.x,r.y,(22-r.life)*1.7+6,(22-r.life)*.3+3,0,0,7);ctx.stroke();}ctx.globalAlpha=1;ctx.restore();if(state.mode==='celebrate'||state.mode==='victory')confetti();}
  function confetti(){for(let i=0;i<45;i++){const x=(i*131+clock*.4*(i%3+1))%W,y=(i*83+clock*(i%2+1))%H;ctx.save();ctx.translate(x,y);ctx.rotate(clock*.02+i);rect(-3,-6,6,12,2,['#e990b0','#f1cb78','#8ecbc0','#b2a4d1'][i%4]);ctx.restore();}}
  function frame(ts){if(!last)last=ts;const elapsed=Math.min(100,Math.max(0,ts-last));last=ts;accumulator+=elapsed;let steps=0;while(accumulator>=STEP&&steps<6){update();accumulator-=STEP;steps++;}render();requestAnimationFrame(frame);}
  function bindHold(button,action){button.addEventListener('pointerdown',e=>{if(!isPlaying())return;e.preventDefault();button.setPointerCapture?.(e.pointerId);input[action].add(e.pointerId);button.classList.add('isDown');if(action==='attack')attack();},{passive:false});const release=e=>{input[action].delete(e.pointerId);if(!input[action].size)button.classList.remove('isDown');};button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release);}
  document.querySelectorAll('[data-hold]').forEach(b=>bindHold(b,b.dataset.hold));
  function tapJump(e){if(!isPlaying())return;e.preventDefault();jump();}
  canvas.addEventListener('pointerdown',tapJump,{passive:false});$('jumpButton').addEventListener('pointerdown',tapJump,{passive:false});
  // Every pointer down is one jump. No delayed dblclick gesture, no zoom, and no held-key auto-jump.
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>useItem(b.dataset.item));
  $('familyButton').onclick=familyScreen;$('pauseButton').onclick=pause;$('switchHero').onclick=switchHero;
  const heldKeys=new Set();
  addEventListener('keydown',e=>{const codes=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyJ'];if(codes.includes(e.code)&&isPlaying())e.preventDefault();if(e.repeat||heldKeys.has(e.code))return;heldKeys.add(e.code);if(e.code==='Escape'){if(state.mode==='paused'){$('resume')?.click();}else pause();return;}if(!isPlaying())return;if(['ArrowLeft','KeyA'].includes(e.code))input.left.add(e.code);if(['ArrowRight','KeyD'].includes(e.code))input.right.add(e.code);if(['Space','ArrowUp','KeyW'].includes(e.code))jump();if(e.code==='KeyJ'){input.attack.add(e.code);attack();}if(e.code==='KeyQ')switchHero();if(e.code==='Digit1')useItem('heart');if(e.code==='Digit2')useItem('shield');if(e.code==='Digit3')useItem('mint');if(e.code==='KeyH')familyHelp('papa');if(e.code==='KeyG')familyHelp('mama');});
  addEventListener('keyup',e=>{heldKeys.delete(e.code);for(const v of Object.values(input))v.delete(e.code);});
  addEventListener('blur',()=>{heldKeys.clear();clearInput();pause();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){save();heldKeys.clear();clearInput();pause();}last=0;accumulator=0;});
  addEventListener('pagehide',save);
  function prepareSprites(img){const sw=img.width/4,sh=img.height/2;const scratch=document.createElement('canvas');scratch.width=sw;scratch.height=sh;const g=scratch.getContext('2d',{willReadFrequently:true});for(let row=0;row<2;row++)for(let col=0;col<4;col++){g.clearRect(0,0,sw,sh);g.drawImage(img,col*sw,row*sh,sw,sh,0,0,sw,sh);const pixels=g.getImageData(0,0,sw,sh).data;let minX=sw,minY=sh,maxX=0,maxY=0;for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){if(pixels[(y*sw+x)*4+3]>45){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}}const c=document.createElement('canvas');c.width=Math.max(1,maxX-minX+1);c.height=Math.max(1,maxY-minY+1);c.getContext('2d').drawImage(scratch,minX,minY,c.width,c.height,0,0,c.width,c.height);sprites[row][col]=c;}atlasReady=true;}
  const atlas=new Image();
  const loadHeroes=new Promise((resolve,reject)=>{atlas.onload=()=>{prepareSprites(atlas);resolve();};atlas.onerror=reject;atlas.src=window.HERO_ATLAS;});
  const loadKingdom=new Promise(resolve=>{kingdomArt.onload=()=>{backgroundReady=true;resolve();};kingdomArt.onerror=resolve;kingdomArt.src=window.KINGDOM_ART;});
  Promise.all([loadHeroes,loadKingdom]).then(()=>{$('loading').hidden=true;generate();menu();requestAnimationFrame(frame);}).catch(()=>{$('loading').innerHTML='<h1>تعذر تحميل الشخصيات</h1><p>أعيدي فتح الصفحة أو تحديثها.</p><button onclick="location.reload()">إعادة المحاولة</button>';});
  // A single self-contained HTML works even if only index.html is uploaded to GitHub.
  // The optional worker is registered only when present, never cached as a 404 page.
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    addEventListener('load',async()=>{try{const res=await fetch('./service-worker.js',{cache:'no-store'});if(res.ok&&/javascript/i.test(res.headers.get('content-type')||'')){const reg=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});await reg.update();}}catch{}});
  }
  // Read-only testing hooks exist only on local development servers.
  if(['localhost','127.0.0.1'].includes(location.hostname))Object.defineProperty(window,'__gameTest',{value:{snapshot:()=>JSON.parse(JSON.stringify({version:VERSION,state,player,boss,W,H,cam,worldY,atlasReady,inputs:Object.fromEntries(Object.entries(input).map(([k,v])=>[k,v.size]))})),step:(n=1)=>{for(let i=0;i<n;i++)update();},setHero:i=>{state.hero=i;},jump,start:()=>{reset();chooseRoute('safe');},warpBoss:(level=1)=>{reset();state.level=level;state.route='safe';state.maryam=true;generate();player.x=4520;boss.active=true;setMode('boss');chrome(true);hide();},damage,save,restore,readSave,resize},configurable:false});
})();
